<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3λ.Rehab.Store</title>
    <!-- خطوط احترافية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- المكاتب البرمجية: Supabase + html2canvas + jsPDF + SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-body: #F6F5F2;
            --bg-surface: #FFFFFF;
            --bg-subtle: #EFECE6;
            --text-primary: #141518;
            --text-secondary: #686763;
            --accent: #B48A3E;
            --accent-dark: #8F6B29;
            --accent-soft: #F9F5EC;
            --border: #E4E1DA;
            --danger: #D92D20;
            --success: #0F9D58;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 2px 8px rgba(20, 21, 24, 0.04);
            --shadow-md: 0 10px 30px rgba(20, 21, 24, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* 1. الشاشة الافتتاحية */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #141518;
            color: #FFFFFF;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-bism { font-family: 'Amiri', serif; font-size: 1.7rem; color: var(--accent); margin-bottom: 12px; }
        .splash-aya { font-family: 'Amiri', serif; font-size: 2rem; color: #FFFFFF; margin-bottom: 24px; letter-spacing: 0.5px; }
        .splash-logo { font-size: 1.5rem; font-weight: 900; color: #FFFFFF; border: 1.5px solid var(--accent); padding: 8px 28px; border-radius: 100px; letter-spacing: 1px; }
        .splash-logo span { color: var(--accent); }

        /* 2. شاشة الإيقاف الطارئ */
        #emergency-lock {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-body);
            z-index: 88888;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 28px;
        }
        #emergency-lock i { font-size: 3.8rem; color: var(--danger); margin-bottom: 16px; }
        #emergency-lock h2 { font-size: 1.4rem; color: var(--text-primary); margin-bottom: 8px; }
        #emergency-lock p { font-size: 0.92rem; color: var(--text-secondary); max-width: 420px; }

        /* 3. الشريط العلوي المتحرك */
        .top-ticker {
            background: var(--text-primary);
            color: #FFFFFF;
            padding: 8px 0;
            font-size: 0.78rem;
            font-weight: 700;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
        }
        .top-ticker-track {
            display: inline-block;
            padding-left: 100%;
            animation: tickerMove 20s linear infinite;
        }
        .top-ticker-track b { color: var(--accent); font-weight: 900; margin: 0 8px; }
        @keyframes tickerMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* 4. الهيدر الرئيسي */
        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
             position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-inner {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-title {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
            letter-spacing: -0.3px;
        }
        .brand-title span { color: var(--accent); }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .btn-nav {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .btn-nav:hover { border-color: var(--accent); color: var(--accent); }
        .btn-nav i { color: var(--accent); }

        /* شريط أدوات المالك العلوي (يظهر عند دخول المالك فقط) */
        #ownerQuickBar {
            display: none;
            background: #141518;
            color: #FFF;
            padding: 10px 20px;
            font-size: 0.8rem;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        body.is-admin #ownerQuickBar { display: flex; }

        /* 5. القائمة الجانبية (Sidebar) */
        .drawer-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 21, 24, 0.45);
            backdrop-filter: blur(2px);
            z-index: 2000;
        }
        .drawer {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: var(--bg-surface);
            border-left: 1px solid var(--border);
            z-index: 2001;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: var(--shadow-md);
        }
        .drawer.open { right: 0; }
        .drawer-link {
            background: var(--bg-body);
            border: 1px solid transparent;
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }
        .drawer-link:hover { border-color: var(--accent); background: var(--accent-soft); }
        .drawer-link i { font-size: 1.1rem; color: var(--accent); }

        /* 6. الحاوية والمساحات الهندسية */
        .main-wrapper {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        /* بانر الواجهة والعجلة */
        .hero-strip {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: var(--shadow-sm);
        }
        .hero-info h1 { font-size: 1.35rem; font-weight: 900; color: var(--text-primary); margin-bottom: 4px; }
        .hero-info p { font-size: 0.85rem; color: var(--text-secondary); }
        .btn-wheel-cta {
            background: var(--text-primary);
            color: #FFFFFF;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-wheel-cta i { color: var(--accent); font-size: 1.1rem; }
        .btn-wheel-cta:hover { background: var(--accent-dark); }

        /* أزرار المنصات الرسمية */
        .social-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        @media(min-width: 768px) { .social-row { grid-template-columns: repeat(4, 1fr); } }
        .soc-pill {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: var(--shadow-sm);
            transition: 0.2s;
        }
        .soc-pill:hover { transform: translateY(-2px); border-color: var(--accent); }
        .soc-pill i { font-size: 1.35rem; }

        /* شريط البحث والأقسام (المجلدات) */
        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }
        @media(min-width: 768px) {
            .controls-bar { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        .search-field {
            position: relative;
            flex: 1;
        }
        .search-field input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            color: var(--text-primary);
            outline: none;
            box-shadow: var(--shadow-sm);
        }
        .search-field input:focus { border-color: var(--accent); }
        .search-field i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .folders-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .folders-bar::-webkit-scrollbar { display: none; }
        .folder-tab {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .folder-tab.active, .folder-tab:hover {
            background: var(--text-primary);
            color: #FFFFFF;
            border-color: var(--text-primary);
        }

        /* 7. شبكة المنتجات وكروت العرض الأنيقة */
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .grid-header h2 { font-size: 1.15rem; font-weight: 900; color: var(--text-primary); }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        @media(min-width: 768px) { .products-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
        @media(min-width: 1024px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; } }

        .prod-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .prod-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .prod-img-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--bg-subtle);
            position: relative;
            overflow: hidden;
        }
        .prod-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .prod-card:hover .prod-img-box img { transform: scale(1.04); }

        .prod-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(20, 21, 24, 0.85);
            backdrop-filter: blur(4px);
            color: #FFFFFF;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 100px;
            z-index: 2;
        }

        /* زر سلة الحذف المباشر على الكارت (يظهر للمالك) */
        .card-trash-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--danger);
            color: #FFFFFF;
            border: 2px solid #FFFFFF;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 12px rgba(217, 45, 32, 0.35);
            transition: transform 0.15s ease;
        }
        .card-trash-btn:hover { transform: scale(1.1); }
        body.is-admin .card-trash-btn { display: flex; }

        .prod-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .prod-cat { font-size: 0.7rem; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
        .prod-title { font-size: 0.92rem; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; line-height: 1.4; }
        .prod-desc { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .prod-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--bg-subtle);
            gap: 8px;
        }
        .prod-price { font-size: 1rem; font-weight: 900; color: var(--text-primary); }
        .prod-price small { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); }
        .btn-buy {
            background: var(--text-primary);
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-buy:hover { background: var(--accent); color: #fff; }
        .btn-buy:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }

        /* 8. النوافذ المنبثقة (Modals) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 21, 24, 0.6);
            backdrop-filter: blur(4px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            box-shadow: var(--shadow-md);
        }
        .modal-card.wide { max-width: 860px; }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 { font-size: 1.05rem; font-weight: 900; color: var
